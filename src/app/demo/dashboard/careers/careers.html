<div class="flex justify-content-between items-center mb-4 w-full">
  <h2>Careers Management</h2>
  <p-button
    label="Create New Career"
    icon="pi pi-plus"
    [routerLink]="['create']"
    severity="primary">
  </p-button>
</div>

<p-table [value]="careers" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Title</th>
      <th>Type</th>
      <th>Location</th>
      <th>Category</th>
      <th>View</th>
      <th>Edit</th>
      <th>Status</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-career>
    <tr>
      <td>{{ career.id }}</td>
      <td>{{ career.en_name }}</td>
      <td>{{ career.en_title }}</td>
      <td>{{ career.en_type }}</td>
      <td>{{ career.en_location }}</td>
      <td>{{ career.en_category_name }}</td>
      <td>
        <a [routerLink]="['view', career.en_slug]">
          <i class="pi pi-eye" style="color: #673ab7"></i>
        </a>
      </td>
      <td>
        <a [routerLink]="['edit', career.en_slug]">
          <i class="pi pi-pencil" style="color: #673ab7"></i>
        </a>
      </td>
      <td>
        <p-toggleswitch
          [ngModel]="returnStatus(career.active_status)"
          (ngModelChange)="onActive(career.en_slug)" />
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="12" class="text-center p-4">
        <div class="flex flex-column align-items-center justify-content-center">
          <i
            class="pi pi-info-circle"
            style="font-size: 2rem; color: var(--text-color-secondary)"></i>
          <span class="mt-2" style="color: var(--text-color-secondary)"
            >No data found</span
          >
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
